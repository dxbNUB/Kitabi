<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#111111"/>

  <!-- Subtle gradient overlay for warmth -->
  <defs>
    <radialGradient id="warm" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#1a1310" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.5"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#warm)"/>

  <!-- Kitabi mark (left side) — same design as favicon, scaled 1.5x -->
  <g transform="translate(120, 187)">
    <rect width="256" height="256" rx="56" ry="56" fill="#1a1714"/>
    <g fill="#C8964D">
      <path d="M 70 130 L 134 70 L 168 108 L 168 130 Z"/>
      <path d="M 100 124 L 134 92 L 154 116 L 134 130 L 102 130 Z" fill="#1a1714"/>
      <rect x="70" y="132" width="138" height="22"/>
      <path d="M 188 132 L 222 132 L 222 200 L 70 200 L 70 180 L 202 180 L 202 132 Z"/>
    </g>
  </g>

  <!-- Wordmark + tagline + label (right side) -->
  <text x="450" y="270"
        font-family="Georgia, 'Cormorant Garamond', serif"
        font-size="130" font-weight="500"
        fill="#C8964D" letter-spacing="6">kitabi</text>

  <text x="450" y="350"
        font-family="Georgia, serif"
        font-size="38" font-style="italic"
        fill="#F5EFE2">Finish the book inside you.</text>

  <text x="450" y="430"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="22" fill="#C8964D"
        letter-spacing="6" font-weight="600">AI WRITING ASSISTANT</text>

  <text x="450" y="470"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="20" fill="rgba(245,239,226,0.55)">
    <tspan>Turn your idea into a finished book — chapter by chapter</tspan>
  </text>
</svg>
